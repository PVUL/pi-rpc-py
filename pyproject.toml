[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pi-rpc"
version = "0.1.0"
description = "Async Python client for the pi coding agent's headless RPC mode"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["pi", "coding-agent", "rpc", "agent", "voice"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/PVUL/pi-rpc-py"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_rpc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
